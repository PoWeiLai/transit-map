<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>公共交通地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --fg:#1f2328; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb;
            --accent:#f5a000; --ok:#16a34a; --warn:#dc2626; --walk:#2563eb; --bike:#f5a000; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e6e6e6; --muted:#9ca3af; --bg:#15171a; --card:#1f2226; --line:#33373d; }
    }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; }
    body { font-family: system-ui, "Noto Sans TC", sans-serif; background:var(--bg); color:var(--fg);
           display:grid; grid-template-columns: 380px 1fr; }
    aside { overflow-y:auto; border-right:1px solid var(--line); display:flex; flex-direction:column; }
    header { padding:14px 16px; background:var(--accent); color:#fff; }
    h1 { margin:0; font-size:18px; }
    #map { height:100%; }
    form { padding:16px; display:grid; gap:10px; }
    label { display:block; margin-bottom:4px; font-size:13px; color:var(--muted); }
    .row { display:flex; gap:6px; }
    .ex { margin:6px 0 0; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
    .ex button { padding:2px 8px; font-size:12px; border-radius:999px; }
    input, select { box-sizing:border-box; width:100%; flex:1; min-width:0; padding:9px 10px; font-size:15px; border-radius:8px; border:1px solid var(--line);
            background:var(--card); color:var(--fg); }
    button { padding:9px 12px; font-size:15px; border-radius:8px; border:1px solid var(--line);
             background:var(--card); color:var(--fg); cursor:pointer; white-space:nowrap; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    .hint { font-size:12px; color:var(--muted); margin:0; }
    #out { padding:0 16px 16px; display:grid; gap:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
    .card h2 { font-size:15px; margin:0 0 8px; }
    .err { border-color:var(--warn); color:var(--warn); }
    .demo { background:#fff7e6; color:#8a5a00; border-color:#f5d08a; }
    .step { display:flex; gap:10px; padding:6px 0; border-top:1px dashed var(--line); }
    .step:first-of-type { border-top:0; }
    .icon { font-size:20px; width:26px; text-align:center; }
    .muted { color:var(--muted); font-size:13px; }
    .big { font-size:22px; font-weight:700; }
    .alt { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0;
           border-top:1px solid var(--line); font-size:14px; cursor:pointer; }
    .alt.sel { font-weight:700; }
    .alt:hover { color:var(--accent); }
    .low { color:var(--warn); } .good { color:var(--ok); }
    .dirs { margin:6px 0 0; padding-left:20px; font-size:13px; line-height:1.6; }
    .dirs li.now { font-weight:700; color:var(--accent); }
    .links { display:flex; gap:6px; margin-top:6px; }
    .links a { font-size:12px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; text-decoration:none; color:var(--fg); }
    a.uber { background:#000; color:#fff !important; border-color:#000; }
    .leaflet-popup-content a.uber { display:inline-block; margin-top:6px; padding:3px 8px; border-radius:6px; text-decoration:none; font-size:12px; }
    details summary { cursor:pointer; font-size:13px; color:var(--muted); margin-top:4px; }
    #nav { display:none; position:sticky; top:0; z-index:5; background:#1f2937; color:#fff; padding:14px 16px; }
    #nav.on { display:block; }
    #nav .stage { font-size:13px; opacity:.8; }
    #nav .instr { font-size:20px; font-weight:700; margin:4px 0; }
    #nav .rest { font-size:13px; opacity:.8; }
    #nav .notice { background:#f5a000; color:#000; border-radius:8px; padding:8px 10px; margin-top:8px; font-weight:700; }
    #nav .notice.cam { background:#dc2626; color:#fff; font-size:17px; }
    .camicon { font-size:18px; line-height:1; text-shadow:0 0 3px #fff; }
    #nav button { margin-top:8px; background:transparent; color:#fff; border-color:#6b7280; font-size:13px; padding:5px 10px; }
    .navbtns { display:flex; gap:6px; }
    .navbtns button { flex:1; }
    .me { position:relative; width:40px; height:40px; }
    .me .dot { position:absolute; left:11px; top:11px; width:18px; height:18px; border-radius:50%;
               background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 2px rgba(37,99,235,.4); }
    .me .cone { position:absolute; left:12px; top:-4px; width:0; height:0; border-left:8px solid transparent;
                border-right:8px solid transparent; border-bottom:18px solid rgba(37,99,235,.55); }
    #nav .dir { display:flex; align-items:center; gap:10px; margin-top:6px; }
    #navArrow { display:inline-block; font-size:30px; line-height:1; transition:transform .3s; }
    #navDir { font-size:15px; font-weight:600; }
    .tabs { display:flex; flex-wrap:wrap; gap:6px; }
    .tabs button { flex:1 1 30%; padding:8px 6px; }
    .chip.tra { background:#0f766e; } .chip.fast { background:#b91c1c; } .chip.hsr { background:#ea580c; }
    .filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .filters button { padding:4px 10px; font-size:13px; border-radius:999px; }
    .filters button.on { background:var(--fg); color:var(--bg); }
    .tabs button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); font-weight:600; }
    .tabs button.svc { border:2px solid #f59e0b; font-weight:600; }
    ol.steps { margin:4px 0 8px; padding-left:22px; }
    ol.steps li { margin:2px 0; }
    body.lookup .route-only { display:none !important; }
    .garbage-next { padding:10px; border-radius:8px; background:#fef3c7; color:#111; margin-bottom:8px; }
    .garbage-next .big { font-size:22px; font-weight:700; }
    .garbage-stops li.truck { font-weight:700; }
    button.link { background:none; border:none; padding:0 4px; color:#2563eb; text-decoration:underline; cursor:pointer; font:inherit; }
    .tabs button.svc.on { background:#f59e0b; color:#111; border-color:#f59e0b; }
    .nearby-item { padding:4px 0; border-bottom:1px solid var(--line, #e5e7eb); }
    .nearby-item:last-child { border-bottom:none; }
    .nearby-item[data-focus] { cursor:pointer; }
    .nearby-item[data-focus]:hover { background:var(--hover, rgba(127,127,127,.12)); }
    .bikeinfo { background:var(--card); color:var(--fg); padding:6px 9px; border-radius:8px; font-size:12px; line-height:1.5;
                box-shadow:0 1px 4px rgba(0,0,0,.3); max-width:190px; }
    .bikeinfo .legend { margin-top:3px; }
    .bikeinfo .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 2px 0 4px; vertical-align:-1px; }
    .bikeinfo .legend i:first-child { margin-left:0; }
    #trip { padding:0 16px; }
    #trip:empty { display:none; }
    .stop { margin-bottom:6px; align-items:center; }
    .stop .num { width:22px; height:22px; border-radius:50%; background:#dc2626; color:#fff; font:700 12px/22px system-ui; text-align:center; flex:none; }
    .stop button { padding:6px 10px; }
    #addStop { width:100%; border-style:dashed; color:var(--muted); }
    label.check { display:flex; align-items:center; gap:6px; margin:6px 0 0; color:var(--fg); }
    label.check input { width:auto; flex:none; }
    .leg { padding:8px 0; border-top:1px solid var(--line); cursor:pointer; }
    .leg:first-of-type { border-top:0; }
    .leg.sel .legname { color:var(--accent); }
    .modes { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
    .modes button { padding:2px 8px; font-size:12px; border-radius:999px; }
    .modes button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
    .modes button:disabled { opacity:.45; cursor:default; }
    .opt { cursor:pointer; }
    .opt.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
    .chips { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin:4px 0; }
    .chip { background:#16a34a; color:#fff; border-radius:6px; padding:1px 7px; font-weight:700; font-size:14px; }
    .chip.walk { background:transparent; color:var(--muted); font-weight:400; padding:0; }
    .eta-now { color:var(--ok); font-weight:700; }
    .seat { font-size:12px; border-radius:6px; padding:1px 6px; border:1px solid currentColor; }
    .seat.O { color:var(--ok); } .seat.L { color:#d97706; } .seat.X { color:var(--warn); text-decoration:line-through; }
    .fares { width:100%; border-collapse:collapse; font-size:13px; margin-top:4px; }
    .fares th, .fares td { padding:4px 6px; border-top:1px solid var(--line); text-align:right; }
    .fares th:first-child, .fares td:first-child { text-align:left; font-weight:400; color:var(--muted); }
    .pin { border-radius:50%; border:2px solid #fff; box-shadow:0 0 3px rgba(0,0,0,.5);
           color:#fff; font:700 11px/20px system-ui; text-align:center; }
    #formToggle, .mapsize { display:none; }
    .mapsize a { font-size:16px; font-weight:700; }
    .traffic a { font-size:16px; }
    .traffic a.on { background:#fde68a; }
    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 45vh; }
      aside { border-right:0; order:1; }
      #map { order:0; height:45vh; }
      /* 手機畫面小：出發點、目的地可以收起來，地圖可以放大 */
      #formToggle { display:block; margin:10px 16px 0; color:var(--muted); font-size:14px; }
      body.form-hidden form { display:none; }
      body.map-big { grid-template-rows: auto 75vh; }
      body.map-big #map { height:75vh; }
      body.map-small { grid-template-rows: auto 25vh; }
      body.map-small #map { height:25vh; }
      .mapsize { display:block; }
    }
  </style>
</head>
<body>
  <aside>
    <header><h1>🗺️ 公共交通地圖</h1></header>
    <div id="nav">
      <div class="stage" id="navStage"></div>
      <div class="instr" id="navInstr"></div>
      <div class="dir"><span id="navArrow">⬆</span><span id="navDir"></span></div>
      <div class="rest" id="navRest"></div>
      <div class="notice" id="navNotice" hidden></div>
      <div class="notice cam" id="navCam" hidden></div>
      <button type="button" id="navStop">結束導航</button>
      <button type="button" id="navVoice">🔊 語音提醒：開</button>
    </div>
    <button type="button" id="formToggle">▲ 收起出發點、目的地</button>
    <form id="form">
      <div>
        <label>交通工具（點一下開／關，可以多選）・橘色是查附近</label>
        <div class="tabs" id="tools"></div>
      </div>
      <div id="lookupRow" hidden>
        <label for="place" id="placeLabel">要查哪裡</label>
        <div class="row">
          <input id="place" placeholder="不填就查目前位置附近" />
          <button type="button" id="placeLocate" title="使用目前位置">📍</button>
        </div>
        <div id="garbageFavs" class="chips" hidden></div>
        <p class="ex" data-for="place">例如：<button type="button">板橋車站</button><button type="button">台北101</button><button type="button">高雄車站</button>・按 📍 或不填就用目前位置</p>
        <button class="primary" type="submit">查詢</button>
      </div>
      <div class="route-only">
        <label for="from">出發點</label>
        <div class="row">
          <input id="from" placeholder="不填就從目前位置出發" />
          <button type="button" id="locate" title="使用目前位置">📍</button>
        </div>
        <p class="ex" data-for="from">例如：<button type="button">捷運科技大樓站</button><button type="button">台北車站</button><button type="button">板橋車站</button>・按 📍 用目前位置</p>
      </div>
      <div id="vehicleRow" class="route-only" hidden>
        <label for="vehicle">取車位置（選填）：先在 GoShare／WeMo／iRent App 找到車，再填車子停的地址</label>
        <input id="vehicle" placeholder="車子停的地址，或點地圖 →「設為取車位置」" />
        <p class="ex" data-for="vehicle">例如：<button type="button">信義路五段7號</button><button type="button">忠孝東路四段1號</button>・不填就從出發點開始騎</p>
        <div class="links">找車：
          <a target="_blank" rel="noopener" href="https://www.ridegoshare.com/">🛵 開啟 GoShare</a>
          <a target="_blank" rel="noopener" href="https://www.wemoscooter.com/">🛵 開啟 WeMo</a>
          <a target="_blank" rel="noopener" href="https://www.irentcar.com.tw/">🚙 開啟 iRent</a>
        </div>
      </div>
      <div id="whenRow" class="route-only" hidden>
        <div class="row">
          <div style="flex:1"><label for="date">乘車日期</label><input id="date" type="date" /></div>
          <div style="flex:1"><label for="time">出發時間</label><input id="time" type="time" /></div>
        </div>
        <p class="ex">列出這個時間之後的班次・不填就是現在 <button type="button" id="whenNow">改回現在</button></p>
      </div>
      <div class="route-only">
        <label>要去的地方</label>
        <div id="stops"></div>
        <button type="button" id="addStop">＋ 新增地點</button>
        <p class="ex" data-for="stop">例如：<button type="button">台北101</button><button type="button">亞東醫院</button><button type="button">國立故宮博物院</button><button type="button">華山1914文化創意產業園區</button></p>
        <div id="orderRow" hidden>
          <label class="check"><input type="checkbox" id="optimize" checked /> 自動排出最順路的順序</label>
          <label class="check"><input type="checkbox" id="roundTrip" /> 最後回到出發點</label>
        </div>
      </div>
      <button class="primary route-only" type="submit">規劃路線</button>
      <p class="hint route-only">也可以直接點地圖設定出發點或加入地點。</p>
    </form>
    <div id="trip"></div>
    <div id="out"></div>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    const km = (m) => (m >= 1000 ? (m / 1000).toFixed(1) + ' 公里' : m + ' 公尺');
    const min = (s) => Math.max(1, Math.round(s / 60)) + ' 分鐘';
    const cls = (n) => (n <= 2 ? 'low' : n >= 5 ? 'good' : '');

    const map = L.map('map').setView([25.0418, 121.5436], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap',
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    // ---------- 手機：收合出發點／目的地、放大地圖 ----------
    const isPhone = () => matchMedia('(max-width: 760px)').matches;
    function setFormHidden(hidden) {
      document.body.classList.toggle('form-hidden', hidden);
      $('formToggle').textContent = hidden ? '▼ 展開出發點、目的地' : '▲ 收起出發點、目的地';
    }
    $('formToggle').addEventListener('click', () => setFormHidden(!document.body.classList.contains('form-hidden')));
    // 地圖高度：小（25%）、中（45%，預設）、大（75%）
    const MAP_SIZES = ['map-small', '', 'map-big'];
    let mapSize = 1;
    function setMapSize(i) {
      mapSize = Math.max(0, Math.min(MAP_SIZES.length - 1, i));
      document.body.classList.remove('map-small', 'map-big');
      if (MAP_SIZES[mapSize]) document.body.classList.add(MAP_SIZES[mapSize]);
      setTimeout(() => map.invalidateSize(), 50); // 地圖大小變了要重新排圖磚
    }
    const sizeCtl = L.control({ position: 'topleft' });
    sizeCtl.onAdd = () => {
      const box = L.DomUtil.create('div', 'leaflet-bar mapsize');
      box.innerHTML = '<a href="#" role="button" title="地圖變大" data-d="1">⤢</a><a href="#" role="button" title="地圖變小" data-d="-1">⤡</a>';
      for (const a of box.children) {
        L.DomEvent.on(a, 'click', (e) => { L.DomEvent.preventDefault(e); setMapSize(mapSize + Number(a.dataset.d)); });
      }
      L.DomEvent.disableClickPropagation(box);
      return box;
    };
    sizeCtl.addTo(map);

    // ---------- 即時路況：地圖上標出車多（橘）、壅塞（紅）的路段 ----------
    const trafficLayer = L.layerGroup().addTo(map);
    const TRAFFIC_COLOR = { slow: '#f59e0b', jam: '#dc2626' };
    let trafficOn = false, trafficTimer = null, trafficSeq = 0;
    async function loadTraffic() {
      // 網頁在背景（切到別的 App、螢幕關了）就不更新，省 TDX 用量；回到畫面時再更新
      if (!trafficOn || document.hidden) return;
      const b = map.getBounds();
      const seq = ++trafficSeq;
      try {
        const r = await api(`/api/traffic?bbox=${[b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map((x) => x.toFixed(4)).join(',')}`);
        if (seq !== trafficSeq || !trafficOn) return; // 地圖又移動了，以新的為準
        trafficLayer.clearLayers();
        for (const sec of r.sections) {
          for (const line of sec.lines) {
            L.polyline(line, { color: TRAFFIC_COLOR[sec.level], weight: 5, opacity: 0.85 })
              .bindPopup(`${sec.level === 'jam' ? '🔴 壅塞' : '🟠 車多'}・平均時速約 ${sec.speed} 公里`).addTo(trafficLayer);
          }
        }
      } catch { /* 路況只是參考，抓不到就算了 */ }
    }
    function setTraffic(on) {
      trafficOn = on;
      document.querySelector('.traffic a')?.classList.toggle('on', on);
      clearInterval(trafficTimer);
      trafficLayer.clearLayers();
      if (on) { loadTraffic(); trafficTimer = setInterval(loadTraffic, 3 * 60 * 1000); }
    }
    let trafficMove = null;
    map.on('moveend', () => { clearTimeout(trafficMove); trafficMove = setTimeout(loadTraffic, 600); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadTraffic(); });
    const trafficCtl = L.control({ position: 'topleft' });
    trafficCtl.onAdd = () => {
      const box = L.DomUtil.create('div', 'leaflet-bar traffic');
      box.innerHTML = '<a href="#" role="button" title="即時路況（橘：車多、紅：壅塞）">🚦</a>';
      L.DomEvent.on(box.firstChild, 'click', (e) => { L.DomEvent.preventDefault(e); setTraffic(!trafficOn); });
      L.DomEvent.disableClickPropagation(box);
      return box;
    };
    trafficCtl.addTo(map);

    // 已確認的座標；使用者改了文字就清掉，重新查詢
    const points = { from: null, vehicle: null };
    // 選的借還車站、停車場、捷運上下車站（只套用在目前看的那一段）
    const CHOICES = ['pickup', 'dropoff', 'parking', 'access', 'egress', 'inPickup', 'inDropoff', 'outPickup', 'outDropoff', 'board', 'alight'];
    const state = Object.fromEntries(CHOICES.map((k) => [k, null]));
    for (const k of ['from', 'vehicle']) $(k).addEventListener('input', () => { points[k] = null; });
    const resetChoices = () => { for (const k of CHOICES) state[k] = null; };

    // ---------- 交通工具（可多選） ----------
    const TOOLS = {
      walk: '🚶 步行', bike: '🚲 YouBike', bus: '🚌 公車', coach: '🚍 客運', metro: '🚇 捷運',
      tra: '🚆 台鐵', thsr: '🚄 高鐵', car: '🚗 開車', moto: '🏍️ 騎機車', scooter: '🛵 共享機車', sharecar: '🚙 共享汽車', uber: '🚕 Uber',
    };
    // 附近找（不是交通工具）：查目的地附近的置物櫃、公廁、垃圾車；只開這些時就只查附近
    const SERVICES = { luggage: '🧳 寄物', toilet: '🚻 公廁', garbage: '🚛 垃圾車' };
    const isService = (t) => t in SERVICES;
    const tools = new Set(['walk', 'bike', 'bus', 'metro']);
    try { // 記住上次開的工具（只存在這台裝置）
      const saved = JSON.parse(localStorage.getItem('tools'));
      if (Array.isArray(saved) && saved.length) { tools.clear(); saved.filter((t) => TOOLS[t] || SERVICES[t]).forEach((t) => tools.add(t)); }
    } catch { /* 無法讀取就用預設 */ }
    $('tools').innerHTML = [...Object.entries(TOOLS), ...Object.entries(SERVICES)]
      .map(([k, v]) => `<button type="button" data-tool="${k}"${isService(k) ? ' class="svc"' : ''}>${v}</button>`).join('');

    // ---------- 要去的地方（可以多個） ----------
    const stops = []; // { el: input, point }
    function addStop(value = '', point = null) {
      const row = document.createElement('div');
      row.className = 'row stop';
      row.innerHTML = '<span class="num"></span><input placeholder="輸入地址或地標" /><button type="button" title="刪除這個地點">✕</button>';
      const stop = { el: row.querySelector('input'), row, point };
      stop.el.value = value;
      stop.el.addEventListener('input', () => { stop.point = null; });
      row.querySelector('button').addEventListener('click', () => {
        if (stops.length === 1) { stop.el.value = ''; stop.point = null; return; } // 至少留一格
        stops.splice(stops.indexOf(stop), 1);
        row.remove();
        refreshStops();
      });
      $('stops').append(row);
      stops.push(stop);
      refreshStops();
      return stop;
    }
    function refreshStops() {
      stops.forEach((s, i) => { s.row.querySelector('.num').textContent = i + 1; });
      $('orderRow').hidden = stops.length < 2;
    }
    // 填入第一個空的地點，都填滿了就新增一格
    const emptyStop = () => stops.find((s) => !s.el.value.trim()) || addStop();
    $('addStop').addEventListener('click', () => addStop().el.focus());
    addStop();

    const pin = (color, text) => L.divIcon({
      className: '', iconSize: [24, 24], iconAnchor: [12, 12],
      html: `<div class="pin" style="background:${color};width:24px;height:24px;line-height:20px">${text}</div>`,
    });

    // 車站的彈出視窗：設為出發點／目的地，以及叫 Uber。每次打開才產生，
    // 已經設好出發點時，Uber 直接帶入「出發點 → 這站」，不用在 Uber 裡重打
    function placeBox(place, head) {
      const box = document.createElement('div');
      const fromHere = points.from && dist(points.from, place) > 50;
      box.innerHTML = `${head}<button data-k="from">設為出發點</button> <button data-k="stop">加入要去的地方</button>
        <br>${fromHere ? uberA(points.from, place, `🚗 Uber：${esc(points.from.name)} → 這裡`) : uberA(null, place, '🚗 Uber 從目前位置叫車到這裡')}`;
      box.addEventListener('click', (ev) => {
        if (ev.target.dataset.k) setPoint(ev.target.dataset.k, place, place.name);
      });
      return box;
    }

    // 高鐵站標在地圖上（開啟高鐵時，不隨規劃結果清除），點一下可設為出發點或目的地
    const stationLayer = L.layerGroup();
    fetch('/api/rail/stations?system=thsr').then((r) => (r.ok ? r.json() : [])).then((list) => {
      for (const s of list) {
        const name = `${s.name}站`;
        const box = () => placeBox({ lat: s.lat, lng: s.lng, name }, `<b>🚄 ${esc(name)}</b><br>`);
        L.marker([s.lat, s.lng], { icon: pin('#ea580c', '高'), zIndexOffset: -100 }).bindPopup(box).addTo(stationLayer);
      }
    }).catch(() => {}); // 沒有 TDX 金鑰時就不標示

    // 全台捷運／輕軌：開啟捷運時畫路線，車站放大到一定程度才顯示（全台約 280 站，縮小時太擠）
    const metroLines = L.layerGroup();
    const metroStops = L.layerGroup();
    const METRO_STOP_ZOOM = 12;
    const headwayText = (h) => (!h ? '' : h.min === h.max
      ? `${h.estimated ? '約 ' : ''}每 ${h.min} 分一班` : `每 ${h.min}～${h.max} 分一班（尖峰較密）`);
    const lastTime = (t) => { const [h, m] = t.split(':').map(Number); return h >= 24 || h < 4 ? `${String(h % 24).padStart(2, '0')}:${String(m).padStart(2, '0')}（隔天）` : t; };
    map.createPane('metro').style.zIndex = 350; // 在底圖之上、規劃路線之下
    fetch('/api/metro/map').then((r) => r.json()).then(({ lines, stations }) => {
      for (const l of lines) {
        L.polyline(l.path, { pane: 'metro', color: l.color, weight: 3, opacity: 0.55, interactive: false }).addTo(metroLines);
      }
      for (const s of stations) {
        const name = s.name.endsWith('站') ? s.name : `${s.name}站`;
        const box = () => placeBox({ lat: s.lat, lng: s.lng, name }, `<b>🚇 ${esc(name)}</b> <span class="muted">${esc(s.operator)}</span>
          ${s.lines.map((l) => `<div class="chips"><span class="chip" style="background:${esc(l.color)}">${esc(l.name)}</span>
            <span class="muted">${headwayText(l.headway)}</span></div>`).join('')}
          ${s.times.length ? `<table class="fares">
            <tr><th>方向</th><th>首班</th><th>末班</th></tr>
            ${s.times.map((t) => `<tr><td><span style="color:${esc(t.color || 'inherit')}">●</span> ${esc(t.dir)}</td><td>${esc(t.first)}</td><td>${esc(lastTime(t.last))}</td></tr>`).join('')}
          </table>` : '<p class="hint">沒有首末班車資料</p>'}`);
        L.circleMarker([s.lat, s.lng], { pane: 'metro', radius: 5, color: s.lines[0]?.color || '#0284c7', weight: 2, fillColor: '#fff', fillOpacity: 1 })
          .bindPopup(box).addTo(metroStops);
      }
    }).catch(() => {});
    // ---------- YouBike 站點：開啟 YouBike 時，地圖放大後顯示各站有沒有車 ----------
    const bikeLayer = L.layerGroup();
    const BIKE_ZOOM = 14;
    const bikeColor = (s) => (s.paused ? '#9ca3af' : s.bikes >= 5 ? '#16a34a' : s.bikes > 0 ? '#f59e0b' : '#dc2626');
    const bikeInfo = L.control({ position: 'topright' });
    bikeInfo.onAdd = () => { const d = L.DomUtil.create('div', 'bikeinfo'); L.DomEvent.disableClickPropagation(d); return d; };
    let bikeTimer = null, bikeReq = 0;

    function refreshBikes() {
      clearTimeout(bikeTimer);
      if (!tools.has('bike')) return;
      bikeTimer = setTimeout(async () => {
        const b = map.getBounds();
        const id = ++bikeReq;
        try {
          const r = await api('/api/youbike?bbox=' + [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map((x) => x.toFixed(5)).join(','));
          if (id !== bikeReq || !tools.has('bike')) return; // 已經有更新的請求
          bikeLayer.clearLayers();
          const zoomed = map.getZoom() >= BIKE_ZOOM && r.stations;
          if (zoomed) {
            for (const s of r.stations) {
              const box = () => placeBox({ lat: s.lat, lng: s.lng, name: s.name }, `<b>🚲 ${esc(s.name)}</b><br>
                ${s.paused ? '<span class="muted">暫停服務</span>' : `可借 <b class="${cls(s.bikes)}">${s.bikes}</b>・可還 <b>${s.docks}</b>`}
                <span class="muted">／共 ${s.total} 柱</span><br><span class="muted">${esc(s.address)}</span><br>`);
              L.circleMarker([s.lat, s.lng], { radius: 6, color: '#fff', weight: 1.5, fillColor: bikeColor(s), fillOpacity: 0.95 })
                .bindPopup(box).addTo(bikeLayer);
            }
          }
          const m = r.summary;
          const allPaused = m.stations && m.paused === m.stations;
          bikeInfo.getContainer().innerHTML = `<b>🚲 畫面內 YouBike</b><br>
            ${m.stations ? `${m.withBikes}／${m.stations} 站有車・共 ${m.bikes} 台${m.paused ? `<br><span class="low">${allPaused ? '全部' : m.paused + ' 站'}暫停服務</span>` : ''}` : '這裡沒有站點'}
            ${zoomed ? `<div class="legend"><i style="background:#16a34a"></i>5 台以上 <i style="background:#f59e0b"></i>1～4 台
              <i style="background:#dc2626"></i>沒車 <i style="background:#9ca3af"></i>暫停</div>` : '<br><span class="muted">放大地圖可看各站</span>'}
            ${r.updatedAt ? `<div class="muted">更新 ${esc(String(r.updatedAt).slice(11, 16))}</div>` : ''}`;
        } catch { /* YouBike 資料暫時抓不到，下次移動地圖再試 */ }
      }, 300);
    }
    map.on('moveend', refreshBikes);

    // 地圖只顯示有開啟的交通工具，表單也只顯示用得到的欄位
    function applyTools() {
      const services = [...tools].filter(isService);
      for (const b of $('tools').children) {
        // 查附近時，交通工具顯示為沒開（按了就回到規劃路線）
        b.classList.toggle('on', tools.has(b.dataset.tool) && (isService(b.dataset.tool) || !services.length));
      }
      document.body.classList.toggle('lookup', services.length > 0);
      renderFavs();
      $('lookupRow').hidden = !services.length;
      // 公廁、寄物是從出發地找最近的；垃圾車是查某個地方幾點會來
      const names = services.map((k) => SERVICES[k].split(' ')[1]).join('、');
      $('placeLabel').textContent = services.every((k) => k === 'garbage')
        ? '要查哪裡的垃圾車（不填就用目前位置）'
        : `出發地（不填就用目前位置），找最近的${names}`;
      const show = (lyr, on) => (on ? lyr.addTo(map) : lyr.remove());
      show(metroLines, tools.has('metro'));
      show(metroStops, tools.has('metro') && map.getZoom() >= METRO_STOP_ZOOM);
      show(stationLayer, tools.has('thsr'));
      show(bikeLayer, tools.has('bike'));
      if (tools.has('bike')) { if (!bikeInfo.getContainer()?.isConnected) bikeInfo.addTo(map); refreshBikes(); }
      else bikeInfo.remove();
      $('vehicleRow').hidden = !tools.has('scooter') && !tools.has('sharecar');
      $('whenRow').hidden = !['tra', 'thsr', 'coach', 'bus'].some((t) => tools.has(t));
    }
    map.on('zoomend', applyTools);

    // 小螢幕時結果在地圖下方，要捲過去才看得到（有行程總覽時捲到總覽）
    function show(html) {
      $('out').innerHTML = html;
      ($('trip').innerHTML ? $('trip') : $('out')).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function currentPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('瀏覽器不支援定位'));
        navigator.geolocation.getCurrentPosition(
          ({ coords }) => resolve({ lat: coords.latitude, lng: coords.longitude, name: '目前位置' }),
          () => reject(new Error('無法取得目前位置，請允許瀏覽器定位，或改輸入地點')),
          { enableHighAccuracy: true, timeout: 10000 },
        );
      });
    }

    async function api(url) {
      const res = await fetch(url);
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || res.statusText);
      return body;
    }

    // 把輸入框的文字查成座標；「目前位置」不是地址，重新整理後座標會遺失，要重新定位
    // near：優先找這附近的地點（同名的「大遠百」全台有好幾家）
    async function lookup(text, emptyMsg, near) {
      const q = text.trim();
      if (q === '目前位置') return currentPosition();
      if (!q) throw new Error(emptyMsg);
      const results = await api('/api/geocode?' + new URLSearchParams({ q, ...(near && { near: `${near.lat},${near.lng}` }) }));
      if (!results.length) {
        const err = new Error(`找不到「${q}」，請換個說法或直接點地圖`);
        err.query = q; // 畫面提供用 Google 地圖找的按鈕
        throw err;
      }
      return results[0];
    }

    // 查不到的地點：到 Google 地圖找，找到後把分享連結或座標貼回輸入框（伺服器會從連結讀出位置）
    // 查不到的地點：在地圖上點一下就填回那個欄位；也保留 Google 地圖的方式
    let pendingPick = null; // { key: 'from'|'place' } 或 { stop }，加上 text
    function googleFix(q, pick) {
      pendingPick = pick ? { ...pick, text: q } : null;
      return `<div class="card">
        ${pick ? `<h2>📍 直接在地圖上點「${esc(q)}」的位置</h2>
          <p>把地圖移到那附近，點一下正確的位置，就會自動填入並繼續${pick.key === 'place' ? '查詢' : '規劃'}。</p>
          <button type="button" class="primary" id="pickOnMap">到地圖上點選</button>` : ''}
        <h2>🔎 或用 Google 地圖找</h2>
        <ol class="steps">
          <li><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(q)}">在 Google 地圖搜尋「${esc(q)}」</a></li>
          <li>找到地點後按「分享」→「複製連結」</li>
          <li>回到這裡（iPhone 按左上角「◀」），按下面的按鈕</li>
        </ol>
        ${pick ? '<button type="button" class="primary" id="pasteGoogle">📋 貼上 Google 地圖的位置</button>' : ''}
        <p class="hint">也可以把連結或座標（例如 24.13702, 120.64192）貼回欄位再查一次。</p>
      </div>`;
    }
    // 從剪貼簿讀 Google 地圖連結（要使用者按按鈕才讀得到）；讀不到就請使用者貼上
    async function pasteGoogle() {
      if (!pendingPick) return;
      let text = '';
      try { text = await navigator.clipboard.readText(); } catch { /* 瀏覽器不允許讀剪貼簿 */ }
      if (!/google|goo\.gl|\d+\.\d+\s*[,，]\s*\d+\.\d+/i.test(text)) text = prompt('貼上從 Google 地圖複製的連結（或座標）') || '';
      if (!text.trim()) return;
      show('<div class="card muted">讀取 Google 地圖的位置…</div>');
      const [found] = await api('/api/geocode?q=' + encodeURIComponent(text.trim())).catch(() => []);
      if (!found) {
        show(`<div class="card err">讀不到這個連結的位置，請確認是從 Google 地圖「分享」→「複製連結」複製的。</div>${googleFix(pendingPick.text, pendingPick)}`);
        return;
      }
      fillPick(found.lat, found.lng);
    }

    // 把位置填回查不到的那個欄位，繼續規劃／查詢（名稱保留使用者輸入的文字）
    function fillPick(lat, lng) {
      const { key, stop, text } = pendingPick;
      pendingPick = null;
      const point = { lat, lng, name: text };
      if (key === 'place') { placePoint = point; $('place').value = text; $('form').requestSubmit(); return; }
      if (key) { points[key] = point; $(key).value = text; }
      if (stop) { stop.point = point; stop.el.value = text; }
      resetChoices();
      plan();
    }

    // 從 Google 地圖切回來時，提醒按貼上
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || !pendingPick) return;
      const b = $('pasteGoogle');
      if (!b) return;
      b.textContent = '📋 回來了！按這裡貼上 Google 地圖的位置';
      b.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // 查不到時記下是哪個欄位
    async function lookupFor(pick, text, emptyMsg, near) {
      try { return await lookup(text, emptyMsg, near); } catch (err) { if (err.query) err.pick = pick; throw err; }
    }
    async function resolve(key, near) {
      // 沒填出發點就從目前位置出發
      if (key === 'from' && !points.from && !$('from').value.trim()) {
        points.from = await currentPosition();
        $('from').value = '目前位置';
        return points.from;
      }
      return points[key] || (points[key] = await lookupFor({ key }, $(key).value, { from: '請輸入出發點', vehicle: '請輸入取車位置' }[key], near));
    }
    async function resolveStop(s, near) {
      return s.point || (s.point = await lookupFor({ stop: s }, s.el.value, '請輸入要去的地方', near));
    }
    // 地點名稱加上行政區，查錯地方時一眼看得出來，例如「大遠百（板橋區）」
    const placeName = (p) => esc(p.name) + (p.area && !p.name.includes(p.area) ? `<span class="muted">（${esc(p.area)}）</span>` : '');

    // ---------- 多個地點：排出最順路的順序 ----------
    // 地點不多（最多 8 個），直接試所有順序，用直線距離比較；可選擇最後回到出發點
    function bestOrder(from, list, back) {
      if (list.length > 8) return list;
      let best = list, bestLen = Infinity;
      const walk = (done, rest, len) => {
        if (len >= bestLen) return;
        if (!rest.length) {
          const total = len + (back ? dist(done.at(-1), from) : 0);
          if (total < bestLen) { bestLen = total; best = done; }
          return;
        }
        rest.forEach((p, i) => walk([...done, p], rest.filter((_, j) => j !== i), len + dist(done.length ? done.at(-1) : from, p)));
      };
      walk([], list, 0);
      return best;
    }

    // ---------- 每一段用開啟的工具各規劃一次，選最快的 ----------
    const RAIL_MIN_M = 8000; // 太近不查台鐵、高鐵（省 TDX 額度）
    const hm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(Math.round(m) % 60).padStart(2, '0')}`;
    const nowMinutes = () => { const d = new Date(Date.now() + 8 * 3600000); return d.getUTCHours() * 60 + d.getUTCMinutes(); };

    // 在這段可以用的工具（步行太遠、火車太近就不考慮）
    function legModes(leg) {
      const d = dist(leg.from, leg.to);
      return [...tools].filter((t) => !isService(t)).filter((t) => (t === 'walk' ? d <= 30000 : ['tra', 'thsr', 'coach'].includes(t) ? d >= RAIL_MIN_M : true));
    }

    // 呼叫對應的規劃 API；choices 是使用者在這段選的借還車站等
    async function fetchMode(mode, leg, choices = {}) {
      const { from, to } = leg;
      const params = new URLSearchParams({ from: `${from.lat},${from.lng}`, to: `${to.lat},${to.lng}` });
      const set = (keys) => keys.forEach((k) => choices[k] && params.set(k, choices[k]));
      if (mode === 'walk') return api('/api/walk?' + params);
      if (mode === 'uber') return api('/api/drive?' + params);
      if (mode === 'bus') {
        // 客運常常是明後天才搭：有指定日期、時間就依那時的時刻表；第二段之後接在前面各段之後
        if ($('date').value) params.set('date', $('date').value);
        if ($('time').value || leg.depart != null) params.set('time', hm(leg.depart ?? 0));
        return api('/api/bus?' + params);
      }
      if (['tra', 'thsr', 'coach', 'metro'].includes(mode)) {
        // 到車站／出站後只用有開啟的工具；沒開步行時只有很近才走路。access／egress 是使用者在這段指定的方式
        params.set('allow', [tools.has('walk') && 'walk', tools.has('bike') && 'youbike', tools.has('bus') && 'bus', tools.has('metro') && 'metro', tools.has('uber') && 'uber'].filter(Boolean).join(','));
        set(['access', 'egress', 'inPickup', 'inDropoff', 'outPickup', 'outDropoff', 'board', 'alight']);
      }
      if (mode === 'metro') return api('/api/metro?' + params);
      if (mode === 'tra' || mode === 'thsr' || mode === 'coach') {
        // 第二段之後的出發時間 = 前面各段走完的時間
        if ($('date').value) params.set('date', $('date').value);
        if ($('time').value || leg.depart != null) params.set('time', hm(leg.depart ?? 0));
        return api(mode === 'coach' ? `/api/coach?${params}` : `/api/rail?system=${mode}&${params}`);
      }
      if (VEHICLE[mode]) {
        params.set('kind', mode);
        if (VEHICLE[mode].shared) {
          // 填業者名稱是想找車，但車輛位置沒有公開資料，只能請使用者到 App 查
          if (/goshare|gogoro|wemo|irent|威摩/i.test($('vehicle').value)) {
            throw new Error('網站查不到共享車的位置（業者沒有公開）。請在 GoShare／WeMo／iRent App 找到車後，把「車子停的地址」填在取車位置，或點地圖 →「設為取車位置」；不填也可以，會從出發點開始規劃。');
          }
          // 取車位置只用在第一段
          const vehicle = leg.index === 0 && $('vehicle').value.trim() ? await resolve('vehicle') : null;
          if (vehicle) params.set('vehicle', `${vehicle.lat},${vehicle.lng}`);
        }
        set(['parking']);
        return api('/api/vehicle?' + params);
      }
      set(['pickup', 'dropoff']);
      if (/站/.test(from.name)) params.set('mrt', '1'); // 從捷運站出發 → 建議出口
      return api('/api/plan?' + params);
    }

    // 各種結果的全程時間（秒）；沒有可搭的班次回傳 null
    function durationOf(mode, r) {
      if (mode === 'bus') return r.options[0]?.total.duration ?? null;
      if (mode === 'metro') return r.options[0]?.duration ?? null;
      if (mode === 'tra' || mode === 'thsr' || mode === 'coach') return r.trains[0] ? (r.trains[0].reach - r.now.minutes) * 60 : null;
      return r.total.duration;
    }

    async function evaluateLeg(leg) {
      const modes = legModes(leg);
      await Promise.all(modes.map(async (m) => {
        try {
          const r = await fetchMode(m, leg);
          leg.results[m] = { r, duration: durationOf(m, r) };
        } catch (err) {
          leg.results[m] = { error: err.message, duration: null };
        }
      }));
      const ok = modes.filter((m) => leg.results[m].duration != null);
      leg.mode = ok.sort((a, b) => leg.results[a].duration - leg.results[b].duration)[0] || modes[0];
    }

    let trip = null; // { legs: [{ index, from, to, depart, results: { mode: { r, duration, error } }, mode }], sel }

    async function plan() {
      pendingPick = null; // 重新規劃，之前等著在地圖上點的地點不算了
      $('trip').innerHTML = '';
      show('<div class="card muted">規劃中…</div>');
      try {
        if (![...tools].some((t) => !isService(t))) throw new Error('請至少開啟一種交通工具');
        const from = await resolve('from');
        const filled = stops.filter((s) => s.el.value.trim() || s.point);
        if (!filled.length) throw new Error('請輸入要去的地方');
        const places = [];
        for (const s of filled) places.push(await resolveStop(s, from)); // 依序查，地址查詢服務限每秒 1 次
        const back = filled.length > 1 && $('roundTrip').checked;
        const order = filled.length > 1 && $('optimize').checked ? bestOrder(from, places, back) : places;
        const seq = [from, ...order, ...(back ? [from] : [])];
        trip = { legs: seq.slice(1).map((to, i) => ({ index: i, from: seq[i], to, results: {}, mode: null })), sel: 0 };

        // 依序規劃，後面一段的出發時間接在前一段之後（火車要用）
        const start = $('time').value ? toMin($('time').value) : nowMinutes();
        let t = start;
        for (const leg of trip.legs) {
          leg.depart = leg.index === 0 && !$('time').value ? null : t;
          $('out').innerHTML = `<div class="card muted">規劃中…第 ${leg.index + 1}／${trip.legs.length} 段</div>`;
          await evaluateLeg(leg);
          t += (leg.results[leg.mode]?.duration || 0) / 60;
        }
        drawStops(seq, back);
        showLeg(0);
        if (isPhone()) setFormHidden(true); // 規劃好了，手機上把輸入區收起來，留空間給地圖和結果
      } catch (err) {
        show(`<div class="card err">${esc(err.message)}</div>${err.query ? googleFix(err.query, err.pick) : ''}`);
      }
    }
    const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };

    // 地圖上的地點編號（換段時保留）
    const tripLayer = L.layerGroup().addTo(map);
    function drawStops(seq, back) {
      tripLayer.clearLayers();
      seq.slice(1, back ? -1 : undefined).forEach((p, i) => {
        L.marker([p.lat, p.lng], { icon: pin('#dc2626', i + 1), zIndexOffset: 500 }).bindPopup(esc(p.name)).addTo(tripLayer);
      });
    }

    // 行程總覽：每一段用哪個工具、多久；點工具可以換，點一段看詳細
    function renderTrip() {
      const legs = trip.legs;
      const total = legs.reduce((n, l) => n + (l.results[l.mode]?.duration || 0), 0);
      const name = (p, i) => (i === 0 ? '出發點' : placeName(p));
      $('trip').innerHTML = `<div class="card">
        <h2>${legs.length > 1 ? `行程 ${legs.length} 段・` : ''}全程約 ${min(total)}</h2>
        ${legs.map((l, i) => `
          <div class="leg ${i === trip.sel ? 'sel' : ''}" data-leg="${i}">
            <div class="legname"><b>${legs.length > 1 ? `${i + 1}. ` : ''}${name(l.from, i)} → ${placeName(l.to)}</b>
              <span class="muted">・${TOOLS[l.mode]}${l.results[l.mode]?.duration != null ? ` 約 ${min(l.results[l.mode].duration)}` : ''}</span></div>
            <div class="modes">${Object.entries(l.results).map(([m, x]) => `
              <button type="button" data-leg="${i}" data-mode="${m}" class="${m === l.mode ? 'on' : ''}" ${x.duration == null ? 'disabled' : ''}
                title="${esc(x.error || '')}">${TOOLS[m]} ${x.duration != null ? min(x.duration) : '不適用'}${m === 'uber' && x.r ? `・$${uberFare(x.r.total.distance, x.r.total.duration).low}起` : ''}${VEHICLE[m] && x.r?.cost ? `・$${x.r.cost[0].low}起` : ''}</button>`).join('')}</div>
          </div>`).join('')}
        ${legs.length > 1 ? '<p class="hint">點一段看詳細路線與導航；點工具可以換這段的交通方式。</p>' : ''}
      </div>`;
    }

    const RENDER = {
      walk: (r, f, t) => renderWalk(r, f, t), bike: (r, f, t) => render(r, f, t), bus: (r, f, t) => renderBus(r, f, t),
      metro: (r, f, t) => renderMetro(r, f, t), tra: (r, f, t) => renderRail(r, f, t), thsr: (r, f, t) => renderRail(r, f, t), coach: (r, f, t) => renderRail(r, f, t),
      car: (r, f, t) => renderVehicle(r, f, t), moto: (r, f, t) => renderVehicle(r, f, t),
      scooter: (r, f, t) => renderVehicle(r, f, t), sharecar: (r, f, t) => renderVehicle(r, f, t), uber: (r, f, t) => renderDrive(r, f, t),
    };

    function showLeg(i) {
      trip.sel = i;
      const leg = trip.legs[i];
      renderTrip();
      const res = leg.results[leg.mode];
      if (!res || res.error) {
        stopNav();
        layer.clearLayers();
        show(`<div class="card err">${esc(res?.error || '這段找不到可用的交通方式')}</div>`);
      } else {
        RENDER[leg.mode](res.r, leg.from, leg.to);
      }
      bikeNotice(leg);
      nearbyLayer.clearLayers();
      // 每段的結果下面都可以直接叫車；選了日期時間時，Uber 連結帶不了時間，提醒在 App 裡預約
      const when = !$('whenRow').hidden && ($('date').value || $('time').value)
        ? `${$('date').value || '今天'} ${$('time').value}`.trim() : '';
      if (leg.mode !== 'uber') {
        // 沒有開車路線，用直線距離 × 1.3、時速 30 公里粗估車資
        const d = dist(leg.from, leg.to) * 1.3;
        $('out').insertAdjacentHTML('beforeend', `<div class="card"><h2>🚗 這段不想轉乘？直接叫 Uber（${fareText(uberFare(d, d / (30 / 3.6)))}）</h2>
          <div class="links">${uberA(leg.from, leg.to, `Uber：${esc(leg.from.name)} → ${esc(leg.to.name)}`)}</div>
          ${when ? `<p class="hint"><b>要 ${esc(when)} 搭車：</b>開啟後在 Uber App 按「預約」（Reserve）選時間，上下車地點會自動帶入。</p>` : ''}
          <p class="hint">會開啟 Uber App（沒裝則開網頁版），車資與到達時間以 Uber 顯示為準。</p></div>`);
      }
    }

    // 開了 YouBike 但這段的起點附近 1 公里內都沒車（例如夜間暫停服務）：說明為什麼沒安排騎車
    async function bikeNotice(leg) {
      if (!tools.has('bike')) return;
      const dLat = 0.009, dLng = 0.01; // 約 1 公里
      try {
        const { summary: m } = await api('/api/youbike?bbox=' + [leg.from.lat - dLat, leg.from.lng - dLng, leg.from.lat + dLat, leg.from.lng + dLng].join(','));
        if (!m.stations || m.withBikes > 0 || trip.legs[trip.sel] !== leg) return;
        $('out').insertAdjacentHTML('afterbegin', `<div class="card demo">🚲 ${leg.index === 0 ? '出發點' : esc(leg.from.name)}附近 1 公里內的
          ${m.stations} 個 YouBike 站目前都沒有車可借${m.paused ? `（${m.paused === m.stations ? '全部' : m.paused + ' 站'}暫停服務，可能因颱風等天候因素或系統維護，請留意 YouBike 公告）` : ''}，
          所以沒有安排騎車。地圖右上角可以看哪裡有車。</div>`);
      } catch { /* 查不到就不顯示 */ }
    }

    // 使用者在詳細結果裡換了借還車站、上下車站等：只重新規劃目前這段
    async function replanLeg() {
      const leg = trip.legs[trip.sel];
      show('<div class="card muted">重新規劃中…</div>');
      try {
        const r = await fetchMode(leg.mode, leg, state);
        leg.results[leg.mode] = { r, duration: durationOf(leg.mode, r) };
      } catch (err) {
        leg.results[leg.mode] = { error: err.message, duration: null };
      }
      showLeg(trip.sel);
    }

    // ---------- 轉彎說明 ----------
    const TURN = {
      left: '左轉', right: '右轉', 'slight left': '靠左', 'slight right': '靠右',
      'sharp left': '向左急轉', 'sharp right': '向右急轉', straight: '直行', uturn: '迴轉',
    };

    function maneuver(s) {
      if (s.type === 'board') return `在「${s.name}」上車`;
      if (s.type === 'stop') return `經過「${s.name}」`;
      if (s.type === 'alight') return `在「${s.name}」下車`;
      if (s.type === 'stairs') return '走樓梯';
      if (s.type === 'elevator') return '搭電梯';
      if (s.type === 'escalator') return '搭手扶梯';
      const road = s.name ? `進入${s.name}` : '';
      if (s.type === 'depart') return s.name ? `沿${s.name}出發` : '出發';
      if (s.type === 'arrive') return '抵達';
      if (s.type === 'roundabout' || s.type === 'rotary') return `進入圓環${s.name ? '，往' + s.name : ''}`;
      const turn = TURN[s.modifier] || '繼續前進';
      if (s.type === 'continue' || s.type === 'new name') {
        return s.modifier === 'straight' || !s.modifier ? `繼續直行${s.name ? '，沿' + s.name : ''}` : turn + road;
      }
      return turn + road;
    }

    function stepText(s) {
      const time = s.time ? ` ${s.time}` : ''; // 火車有到站時刻
      if (s.type === 'board' || s.type === 'alight') return maneuver(s) + time;
      if (s.type === 'stop') return s.name + time;
      return s.type === 'arrive' ? '抵達' : `${maneuver(s)}，走 ${km(s.distance)}`;
    }

    // 「台北車站」本身就有站字；只有一個出口的站，TDX 編號為 0
    const stationName = (e) => (e.station.endsWith('站') ? e.station : e.station + '站');
    const exitNo = (e) => (e.exit === '0' ? '出口' : `${e.exit} 號出口`);

    // Uber 叫車連結：手機有裝 App 會直接開 App，沒有就開網頁版；不給 from 就從目前位置上車
    function uberLink(from, to) {
      const q = new URLSearchParams({ action: 'setPickup' });
      if (from) {
        q.set('pickup[latitude]', from.lat);
        q.set('pickup[longitude]', from.lng);
        if (from.name) q.set('pickup[nickname]', from.name);
        if (from.name) q.set('pickup[formatted_address]', from.name);
      } else {
        q.set('pickup', 'my_location');
      }
      q.set('dropoff[latitude]', to.lat);
      q.set('dropoff[longitude]', to.lng);
      if (to.name) q.set('dropoff[nickname]', to.name);
      if (to.name) q.set('dropoff[formatted_address]', to.name);
      return 'https://m.uber.com/ul/?' + q;
    }
    const uberA = (from, to, text) => `<a class="uber" target="_blank" rel="noopener" href="${esc(uberLink(from, to))}">${text}</a>`;

    const GMODE = { foot: 'walking', bike: 'bicycling', bus: 'transit', train: 'transit', metro: 'transit', scooter: 'driving', car: 'driving', taxi: 'driving' };
    const TRANSIT = new Set(['bus', 'train', 'metro']); // 坐車的段：步驟是沿途各站
    function gmaps(from, to, mode) {
      return 'https://www.google.com/maps/dir/?api=1&' + new URLSearchParams({
        origin: `${from.lat},${from.lng}`, destination: `${to.lat},${to.lng}`, travelmode: GMODE[mode],
      });
    }

    // ---------- 規劃結果 ----------
    let current = null; // { stages, from, to }

    function render(p, from, to) {
      stopNav();
      layer.clearLayers();
      const [walk1, ride, walk2] = p.legs.length === 3 ? p.legs : [p.legs[0], null, p.legs[1]];

      // 每段路的起訖點、標題與到達提示，導航時依序走完
      const exit = p.exit;
      const stages = [
        { leg: walk1, from: exit || from, to: p.pickup, icon: '🚶', title: `步行到借車站：${p.pickup.name}`,
          arrive: `已到達借車站「${p.pickup.name}」，請借車 🚲` },
        ride && { leg: ride, from: p.pickup, to: p.dropoff, icon: '🚲', title: `騎車到還車站：${p.dropoff.name}`,
          arrive: `已到達還車站「${p.dropoff.name}」，請還車` },
        { leg: walk2, from: p.dropoff, to, icon: '🚶', title: `步行到目的地：${to.name}`,
          arrive: '🎉 已抵達目的地' },
      ].filter(Boolean);
      current = { stages, from, to };

      drawLegs(p.legs, from, to);
      if (p.exit) {
        L.marker([p.exit.lat, p.exit.lng], { icon: pin('#0891b2', p.exit.exit.length <= 2 && p.exit.exit !== '0' ? p.exit.exit : '出') })
          .bindPopup(`${esc(p.exit.name)}<br>${esc(p.exit.description)}`).addTo(layer);
      }
      for (const s of p.pickups) stationMarker(s, s.id === p.pickup.id ? '#16a34a' : '#86efac', '借');
      for (const s of p.dropoffs) stationMarker(s, s.id === p.dropoff.id ? '#7c3aed' : '#c4b5fd', '還');
      map.fitBounds(L.featureGroup(layer.getLayers()).getBounds(), { padding: [30, 30] });

      const est = p.legs.some((l) => l.estimated) ? '<p class="hint">※ 部分路線服務無回應，為直線距離估算</p>' : '';
      const alt = (list, sel, type) => list.map((s) => `
        <div class="alt ${s.id === sel ? 'sel' : ''}" data-type="${type}" data-id="${s.id}">
          <span>${esc(s.name)}<br><span class="muted">距離 ${km(s.distance)}</span></span>
          <span>${type === 'pickup' ? '可借' : '可還'}
            <b class="${cls(type === 'pickup' ? s.bikes : s.docks)}">${type === 'pickup' ? s.bikes : s.docks}</b></span>
        </div>`).join('');

      show(`
        ${p.demo ? '<div class="card demo">⚠️ 示範模式：可借/可還數字為模擬資料</div>' : ''}
        ${p.suggestWalk ? '<div class="card demo">附近的 YouBike 站要繞路（或起訖點很近），直接走路可能更快</div>' : ''}
        <div class="card">
          <div class="muted">全程約</div>
          <div class="big">${min(p.total.duration)}・${km(p.total.distance)}</div>
          <div class="muted">${exercise(p.legs)}</div>
          ${stages.map((st, i) => stageHtml(st, i,
            st.leg === walk1 ? `${exit ? `從 <b>${esc(stationName(exit))} ${esc(exitNo(exit))}</b> 出站，` : ''}步行到 <b>${esc(p.pickup.name)}</b> 借車（可借 <b class="${cls(p.pickup.bikes)}">${p.pickup.bikes}</b> 台）<br>`
            : st.leg === ride ? `騎到 <b>${esc(p.dropoff.name)}</b> 還車（可還 <b class="${cls(p.dropoff.docks)}">${p.dropoff.docks}</b> 位）<br>`
            : `從還車站步行到 <b>${esc(to.name)}</b><br>`)).join('')}
          ${est}
          ${navButtons}
        </div>
        ${exit ? `<div class="card"><h2>🚇 建議從 ${esc(stationName(exit))} ${esc(exitNo(exit))}出站</h2>
          <div class="muted">${esc(exit.description)}${exit.elevator ? '・有電梯' : ''}・離借車站約 ${km(exit.toPickup)}</div>
          ${p.exits.slice(1, 6).map((e) => `<div class="alt" style="cursor:default"><span>${esc(exitNo(e))}<br>
            <span class="muted">${esc(e.description)}</span></span><span class="muted">離借車站 ${km(e.toPickup)}</span></div>`).join('')}
        </div>` : ''}
        <div class="card"><h2>出發點附近可借車站點</h2>${alt(p.pickups, p.pickup.id, 'pickup')}</div>
        <div class="card"><h2>目的地附近可還車站點</h2>${alt(p.dropoffs, p.dropoff.id, 'dropoff')}</div>
        <p class="hint">點選其他站點可改用該站重新規劃。資料更新：${esc(p.pickup.updatedAt)}</p>
      `);
    }

    // ---------- 全程走路 ----------
    function renderWalk(p, from, to) {
      stopNav();
      layer.clearLayers();
      const leg = p.legs[0];
      current = { stages: [{ leg, from, to, icon: '🚶', title: `步行到目的地：${to.name}`, arrive: '🎉 已抵達目的地' }], from, to };
      drawLegs(p.legs, from, to);
      map.fitBounds(L.featureGroup(layer.getLayers()).getBounds(), { padding: [30, 30] });
      show(`
        <div class="card">
          <div class="muted">全程走路約</div>
          <div class="big">${min(p.total.duration)}・${km(p.total.distance)}</div>
          <div class="muted">${exercise(p.legs)}</div>
          ${stageHtml(current.stages[0], 0, `步行到 <b>${esc(to.name)}</b><br>`)}
          ${leg.estimated ? '<p class="hint">※ 路線服務無回應，為直線距離估算</p>' : ''}
          ${navButtons}
        </div>`);
    }

    // ---------- Uber 車資估算 ----------
    // Uber 在北北基依政府計程車費率計價：起跳 1.25 公里 85 元、之後每 200 公尺 5 元、
    // 低速（塞車、等紅燈）每 60 秒 5 元，夜間（23～6 點）加 20 元。低速時間抓行車時間的 1/4，
    // 尖峰動態加價最多再抓 3 成；只是參考，實際以 Uber App 報價為準
    const FARE = { start: 85, startM: 1250, stepM: 200, step: 5, slowMin: 5, slowShare: 0.25, night: 20, surge: 1.3 };
    function uberFare(distanceM, durationS) {
      const meter = FARE.start + Math.ceil(Math.max(0, distanceM - FARE.startM) / FARE.stepM) * FARE.step
        + Math.floor((durationS / 60) * FARE.slowShare) * FARE.slowMin;
      const h = new Date(Date.now() + 8 * 3600000).getUTCHours();
      const low = meter + (h >= 23 || h < 6 ? FARE.night : 0);
      return { low, high: Math.round((low * FARE.surge) / 5) * 5 };
    }
    const fareText = (f) => `約 $${f.low}～$${f.high}`;
    const FARE_NOTE = '車資依北北基計程車費率估算（含塞車、夜間加成），尖峰可能更高，其他縣市費率不同，實際以 Uber App 報價為準。';

    // ---------- Uber（開車） ----------
    function renderDrive(p, from, to) {
      stopNav();
      layer.clearLayers();
      const leg = p.legs[0];
      current = { stages: [{ leg, from, to, icon: '🚗', title: `搭 Uber 到：${to.name}`, arrive: '🎉 已抵達目的地' }], from, to };
      drawLegs(p.legs, from, to);
      map.fitBounds(L.featureGroup(layer.getLayers()).getBounds(), { padding: [30, 30] });
      show(`
        <div class="card">
          <div class="muted">搭 Uber 約（不含等車）</div>
          <div class="big">${min(p.total.duration)}・${km(p.total.distance)}</div>
          <div>💰 車資 <b>${fareText(uberFare(p.total.distance, p.total.duration))}</b></div>
          <div class="links" style="margin:8px 0">${uberA(from, to, `🚗 叫 Uber：${esc(from.name)} → ${esc(to.name)}`)}</div>
          <p class="hint">上下車地點會自動帶入 Uber，登入後確認車型與車資即可。時間為一般路況估計。${FARE_NOTE}</p>
          ${leg.estimated ? '<p class="hint">※ 路線服務無回應，為直線距離估算</p>' : ''}
        </div>`);
    }

    // 運動量：走路約每公里 50 大卡、騎腳踏車約每公里 25 大卡（以 60 公斤估算），走路另算步數（步幅約 0.7 公尺）
    function exercise(legs) {
      const walk = legs.filter((l) => l.mode === 'foot').reduce((n, l) => n + l.distance, 0);
      const bike = legs.filter((l) => l.mode === 'bike').reduce((n, l) => n + l.distance, 0);
      const kcal = Math.round((walk / 1000) * 50 + (bike / 1000) * 25);
      const parts = [walk && `走路 ${km(walk)}（約 ${Math.round(walk / 0.7).toLocaleString()} 步）`, bike && `騎車 ${km(bike)}`].filter(Boolean);
      return `🔥 運動量：${parts.join('、')}，約消耗 ${kcal} 大卡（以 60 公斤估算）`;
    }

    // ---------- 共用：每一段的說明與地圖線 ----------
    function stageHtml(st, i, detail) {
      const isTransit = TRANSIT.has(st.leg.mode);
      return `
        <div class="step"><span class="icon">${st.icon}</span><div style="flex:1">
          ${detail}
          <span class="muted">${isTransit ? `${st.leg.stopCount} 站・` : ''}${km(st.leg.distance)}・約 ${min(st.leg.duration)}</span>
          <details ${st.leg.mode === 'foot' ? 'open' : ''}>
            <summary>${isTransit ? `沿途停靠站（${st.leg.stopCount} 站）` : `怎麼走（${st.leg.steps.length} 個步驟）`}</summary>
            <ol class="dirs" data-stage="${i}">${st.leg.steps.map((s) => `<li>${esc(stepText(s))}</li>`).join('')}</ol>
          </details>
          <div class="links"><a target="_blank" rel="noopener" href="${gmaps(st.from, st.to, st.leg.mode)}">用 Google 地圖導航這段</a>
            ${st.leg.mode === 'taxi' ? uberA(st.from, st.to, '🚗 用 Uber 叫車') : ''}</div>
        </div></div>`;
    }

    const LEG_STYLE = {
      foot: { color: '#2563eb', weight: 5, dashArray: '6 8' },
      bike: { color: '#f5a000', weight: 6 },
      bus: { color: '#16a34a', weight: 6 },
      scooter: { color: '#7c3aed', weight: 6 },
      car: { color: '#be123c', weight: 6 },
      train: { color: '#0f766e', weight: 6 },
      metro: { color: '#0284c7', weight: 6 },
      taxi: { color: '#ca8a04', weight: 5 },
    };

    function drawLegs(legs, from, to) {
      for (const leg of legs) {
        const style = leg.color ? { ...LEG_STYLE[leg.mode], color: leg.color } : LEG_STYLE[leg.mode]; // 捷運用路線顏色
        L.polyline(leg.path, style).addTo(layer);
        if (TRANSIT.has(leg.mode)) {
          for (const s of leg.steps) {
            L.circleMarker([s.lat, s.lng], { radius: s.type === 'stop' ? 3 : 6, color: style.color, fillColor: '#fff', fillOpacity: 1, weight: 2 })
              .bindPopup(`${esc(s.name)}${s.address ? '<br>' + esc(s.address) : ''}`).addTo(layer);
          }
        }
      }
      L.marker([from.lat, from.lng], { icon: pin('#2563eb', '起') }).bindPopup(esc(from.name)).addTo(layer);
      L.marker([to.lat, to.lng], { icon: pin('#dc2626', '終') }).bindPopup(esc(to.name)).addTo(layer);
    }

    const navButtons = `
      <div class="navbtns">
        <button type="button" class="primary" id="navStart">▶ 開始導航</button>
        <button type="button" id="navSim" title="沿路線模擬移動，在電腦上測試導航">模擬導航</button>
      </div>`;

    // ---------- 公車 ----------
    let busResult = null; // 最近一次公車規劃結果，切換方案時不用重查

    const etaHtml = (b) => `<span class="${b.eta != null && b.eta >= 0 && b.eta < 180 ? 'eta-now' : 'muted'}">${esc(b.etaText)}</span>`;
    // 客運：接下來班次、票價、業者電話與官網、路線圖，不用再到客運網站查
    const webLink = (url, text) => (/^https?:\/\//.test(url) ? ` <a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : '');
    function coachHtml(l) {
      const c = l.coach;
      if (!c) return '';
      const nt = ([a, b]) => (a === b ? `NT$${a}` : `NT$${a}～${b}`);
      const op = c.operator;
      const lines = [
        c.next?.length && `接下來班次：${c.next.map(esc).join('、')}`,
        c.fare && `票價：全票 ${nt(c.fare.full)}${c.fare.half ? `・半票 ${nt(c.fare.half)}` : ''}`,
        op && `${esc(op.name)}${op.phone ? ` <a href="tel:${esc(op.phone)}">${esc(op.phone)}</a>` : ''}${webLink(op.url, '官網')}`,
        webLink(c.map, '路線圖').trim(),
      ].filter(Boolean);
      return lines.length ? `<span class="muted">${lines.join('<br>')}</span><br>` : '';
    }

    function renderBus(r, from, to) {
      busResult = { r, from, to };
      if (!r.options.length) {
        stopNav();
        layer.clearLayers();
        if (r.loading) return show(`<div class="card demo">這個縣市的公車資料第一次下載中（約半分鐘到一分鐘），請稍後再查一次</div>${nearbyHtml(r.nearby)}`);
        return show(`<div class="card err">附近 600 公尺內找不到可以到達的公車（最多轉乘一次；偏遠地區班次少，可能沒有資料）</div>
          ${nearbyHtml(r.nearby)}`);
      }
      showBusOption(0);
    }

    function nearbyHtml(list) {
      if (!list.length) return '';
      return `<div class="card"><h2>🚏 出發點附近公車即時到站</h2>
        ${list.map((n) => `<div class="alt" style="cursor:default">
          <span><span class="chip">${esc(n.route)}</span> <span class="muted">${esc(n.headsign)}</span><br>
          <span class="muted">${esc(n.stop)}・${km(n.distance)}</span></span>${etaHtml(n)}</div>`).join('')}
      </div>`;
    }

    function showBusOption(idx) {
      const { r, from, to } = busResult;
      const o = r.options[idx];
      stopNav();
      layer.clearLayers();

      // 每段的起訖點：步行段接在前一班車下車處（或出發點）與下一班車上車處（或目的地）之間
      const stages = o.legs.map((leg, i) => {
        const prev = o.legs[i - 1], next = o.legs[i + 1];
        if (leg.mode === 'bus') {
          const nextBus = next?.mode === 'bus' ? next : null; // 原地轉乘
          return {
            leg, from: leg.board, to: leg.alight, icon: '🚌',
            title: `搭 ${leg.route}（${leg.headsign}）到「${leg.alight.name}」`,
            arrive: nextBus
              ? `請在「${leg.alight.name}」下車，原地轉乘 ${nextBus.route}`
              : `請在「${leg.alight.name}」下車 🔔`,
          };
        }
        const legFrom = prev?.mode === 'bus' ? prev.alight : from;
        if (next?.mode === 'bus') {
          return {
            leg, from: legFrom, to: next.board, icon: '🚶',
            title: `${prev ? '步行轉乘到' : '步行到公車站'}「${next.board.name}」`,
            arrive: `已到達「${next.board.name}」站牌，請搭 ${next.route}（${next.headsign}）・${next.etaText}`,
          };
        }
        return { leg, from: legFrom, to, icon: '🚶', title: `步行到目的地：${to.name}`, arrive: '🎉 已抵達目的地' };
      });
      current = { stages, from, to };
      drawLegs(o.legs, from, to);
      map.fitBounds(L.featureGroup(layer.getLayers()).getBounds(), { padding: [30, 30] });

      const chips = (opt) => opt.legs.map((l) => (l.mode === 'bus'
        ? `<span class="chip">${esc(l.route)}</span>`
        : `<span class="chip walk">🚶${Math.max(1, Math.round(l.duration / 60))}′</span>`)).join(' › ');

      const detail = (st) => {
        const l = st.leg;
        if (l.mode === 'bus') {
          return `搭 <span class="chip">${esc(l.route)}</span> ${esc(l.headsign)}<br>
            「${esc(l.board.name)}」上車 → 「${esc(l.alight.name)}」下車<br>${etaHtml(l)}<br>${coachHtml(l)}`;
        }
        return `${esc(st.title)}<br>`;
      };

      const est = o.legs.some((l) => l.estimated) ? '<p class="hint">※ 部分步行路線服務無回應，為直線距離估算</p>' : '';
      // 不是現在搭：依時刻表規劃，市區公車沒有時刻表只能估計
      const later = r.live === false
        ? `<div class="card demo">依 ${esc(r.when.date)} ${hhmm(r.when.minutes)} 出發規劃：客運看時刻表的發車時間；市區公車沒有時刻表，等車時間為估計值，出發前請再查一次即時到站。</div>`
        : '';
      show(`
        ${later}
        ${r.options.map((opt, i) => `
          <div class="card opt ${i === idx ? 'sel' : ''}" data-opt="${i}">
            <div class="chips">${chips(opt)}</div>
            <div><b>約 ${min(opt.total.duration)}</b>
              <span class="muted">・${opt.transfers ? `轉乘 ${opt.transfers} 次` : '直達'}・步行 ${km(opt.walkDistance)}・第一班 ${esc(opt.legs.find((l) => l.mode === 'bus').etaText)}</span></div>
          </div>`).join('')}
        <div class="card">
          <h2>路線說明</h2>
          ${stages.map((st, i) => stageHtml(st, i, detail(st))).join('')}
          ${est}
          ${navButtons}
        </div>
        ${nearbyHtml(r.nearby)}
        <p class="hint">時間含等車的估計值；到站時間每 30 秒更新，重新規劃即可取得最新資訊。</p>
      `);
    }

    // ---------- 附近找：寄物、公廁、垃圾車 ----------
    // 置物櫃：OpenStreetMap（只有部分地點）；公廁：環境部建檔公廁（或 OpenStreetMap）；
    // 垃圾車：有公開資料的縣市的清運點與表定經過時間＋即時位置。結果都直接標在網站地圖上
    const NEARBY = {
      luggage: { title: '🧳 寄放行李', api: 'lockers', render: lockersHtml },
      toilet: { title: '🚻 公廁', api: 'toilets', render: toiletsHtml },
      garbage: { title: '🚛 垃圾車', api: 'garbage', render: garbageHtml },
    };
    const nearbyCache = new Map();
    const nearbyLayer = L.layerGroup().addTo(map);
    const item = (main, sub, at) => `<div class="nearby-item"${at ? ` data-focus="${at.lat},${at.lng}" role="button" tabindex="0"` : ''}>${main}${sub ? `<br><span class="muted">${sub}</span>` : ''}</div>`;
    // 帶我去：把這個地點當目的地，從出發地規劃路線
    const goButton = (x, name) => ` <button type="button" class="link" data-go="${x.lat},${x.lng}" data-go-name="${esc(name)}">🚶 帶我去</button>`;
    const meters = (d) => (d >= 1000 ? `${(d / 1000).toFixed(1)} 公里` : `${d} 公尺`);

    function nearbyPanel(p, services, where = '目的地') {
      nearbyLayer.clearLayers();
      const q = `${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;
      return services.map((k) => `<div class="card"><h2>${NEARBY[k].title}・${esc(where)}附近</h2>
          <div class="nearby" data-kind="${k}" data-near="${q}"><span class="muted">查詢中…</span></div></div>`).join('');
    }

    async function fillNearby() {
      for (const el of document.querySelectorAll('.nearby[data-near]:not([data-done])')) {
        el.dataset.done = '1';
        const { kind, near } = el.dataset;
        const key = `${kind}@${near}`;
        if (!nearbyCache.has(key) || kind === 'garbage') nearbyCache.set(key, api(`/api/${NEARBY[kind].api}?near=${near}`).catch(() => null));
        const r = await nearbyCache.get(key);
        if (!el.isConnected) continue; // 畫面已經換了
        el.innerHTML = r ? NEARBY[kind].render(r) : '<span class="muted">暫時查不到，請稍後再試。</span>';
        // 公廁、置物櫃：地圖縮放到看得到出發地和最近的幾個
        if (kind !== 'garbage' && nearbyLayer.getLayers().length) {
          map.fitBounds(L.featureGroup([...nearbyLayer.getLayers(), ...tripLayer.getLayers()]).getBounds(), { padding: [40, 40], maxZoom: 17 });
        }
        if (kind === 'garbage') {
          watchGarbage(el, near, r);
          autoRoute(el, r);
        }
      }
    }

    // 地圖上標出附近的點
    function markNearby(list, icon) {
      for (const x of list) {
        if (x.lat == null) continue;
        L.marker([x.lat, x.lng], { icon: L.divIcon({ className: '', html: `<div style="font-size:20px">${icon}</div>`, iconSize: [24, 24] }) })
          .bindPopup(esc(x.name || '')).addTo(nearbyLayer);
      }
    }

    function lockersHtml(list) {
      markNearby(list, '🧳');
      return list.length
        ? list.map((l) => item(esc(l.name) + goButton(l, l.name), [meters(l.distance), l.hours && esc(l.hours), l.fee && esc(l.fee)].filter(Boolean).join('・'), l)).join('')
          + '<p class="hint">車站置物櫃依台鐵公告（2025/09）、高鐵、高捷官網與北捷、機捷整理資料（2024/01），沒有即時空櫃數，收費與位置以現場為準。</p>'
        : '<span class="muted">5 公里內沒有置物櫃資料（台鐵、捷運沒有公開置物櫃資料，目前只有部分地點），大車站多半有置物櫃或行李房，可以到車站服務台詢問。</span>';
    }

    function toiletsHtml(r) {
      markNearby(r.toilets, '🚻');
      const list = r.toilets.length
        ? r.toilets.map((t) => item(`${esc(t.name)}${t.grade ? `<span class="muted">（${esc(t.grade)}）</span>` : ''}${goButton(t, t.address || t.name)}`,
          [meters(t.distance), t.address && esc(t.address), t.type && esc(t.type), t.hours && esc(t.hours), t.diaper && '有尿布台'].filter(Boolean).join('・'), t)).join('')
        : '<span class="muted">附近 5 公里內沒有公廁資料，可以找附近的超商、加油站、捷運站。</span>';
      return list + (r.source === 'osm' ? '<p class="hint">目前用 OpenStreetMap 的公廁資料，可能不完整。</p>' : '<p class="hint">資料來源：環境部全國公廁建檔資料。</p>');
    }

    // 垃圾車現在的進度：在路線上的哪一站、還有幾站、比表定晚多少
    function progressText(g) {
      const late = g.late > 2 ? `比表定晚 ${g.late} 分` : g.late < -2 ? `比表定早 ${-g.late} 分` : '大約準時';
      const where = `🚛 現在在「${esc(g.at)}」附近（${g.ago ? `${g.ago} 分鐘前` : '剛剛'}回報，${late}）`;
      return g.left > 0 ? `${where}，還有 ${g.left} 站到這裡` : `${where}，<b>已經過了這裡</b>`;
    }

    function garbageHtml(r) {
      routeTruck = null; // 換地點查詢，之前打開的路線不算了
      markGarbagePoints(r.points);
      updateTrucks(r);
      if (!r.covered) return '<span class="muted">這附近的縣市沒有公開垃圾車資料（目前有：台北、新北、基隆、宜蘭、台中、新竹市、高雄的清運時間，以及新北、台中、台南、高雄的垃圾車即時位置），請洽當地清潔隊或環保局。</span>';
      return `<div class="garbage-list">${garbageListHtml(r)}</div><div class="garbage-route"></div>
        <p class="hint">「預計」是依垃圾車即時位置推算（目前只有新北）；高雄是環保局的今日預估；其他為表定時間，遇假日、颱風可能異動。</p>`;
    }

    // 地圖上的丟垃圾地點：點開看幾點有車
    function markGarbagePoints(points) {
      for (const pt of points) {
        if (pt.lat == null) continue; // 只有地址的點不標
        L.marker([pt.lat, pt.lng], { icon: L.divIcon({ className: '', html: '<div style="font-size:20px">🗑️</div>', iconSize: [24, 24] }) })
          .bindPopup(`<b>${esc(pt.name)}</b><br>${pt.passes.map((x) => `${esc(x.start)}　${esc(x.route)}`).join('<br>')}`).addTo(nearbyLayer);
      }
    }

    // 最上面：下一台幾點到、現在到哪；下面是附近每個固定丟垃圾的地點，幾點有哪些車經過
    function garbageListHtml(r) {
      const time = new Date(Date.now() + 8 * 3600000).toISOString().slice(11, 16);
      const fav = favButton();
      if (!r.points.length) {
        if (r.failed && !r.loading) return '<span class="muted">這個縣市的垃圾車資料暫時抓不到（環保局網站沒有回應），請過一段時間再查。</span>';
        return r.loading
          ? `<div class="garbage-next"><div class="big">⏳ 垃圾車資料下載中</div><div>第一次查這個縣市要等一下（約 1 分鐘），會自動重新整理。</div></div>`
          : `<span class="muted">600 公尺內沒有固定丟垃圾的地點（清運點）資料，換個地點或點地圖上其他位置試試。</span>${fav}`;
      }
      const n = r.next;
      const head = n
        ? `<div class="garbage-next">
            <div class="big">🚛 ${esc(n.when)}${n.soon >= 0 ? `（還有 ${n.soon} 分鐘）` : '（快到了）'}</div>
            <div>到「${esc(n.name)}」・${n.distance != null ? `離你 ${meters(n.distance)}` : esc(r.points.find((pt) => pt.name === n.name)?.approx || '')}</div>
            <div>${n.progress ? progressText(n.progress) : '垃圾車還沒出發（或這個縣市沒有即時位置），時間為表定'}</div>
            ${fav}
          </div>`
        : `<div class="garbage-next"><div class="big">今天附近沒有垃圾車了</div><div>下面是每個地點的收運時間。</div>${fav}</div>`;
      const list = `<p><b>🗑️ 附近固定丟垃圾的地點</b></p>${r.points.map((pt) => item(
        `<b>${esc(pt.name)}</b>・${pt.distance != null ? `${meters(pt.distance)}${goButton(pt, pt.name)}` : esc(pt.approx)}`,
        pt.passes.map((x) => `${esc(x.when)}・${esc(x.route)}${x.days ? `（${esc(x.days)}）` : ''}${x.progress ? `<br>${progressText(x.progress)}` : ''}
          ${x.line ? `<button type="button" class="link" data-garbage-line="${esc(x.line)}" data-garbage-stop="${esc(pt.name)}">看進度</button>` : ''}${x.note ? `<br><span class="muted">${esc(x.note)}</span>` : ''}`).join('<br>'),
        pt.lat != null ? pt : null)).join('')}`;
      const live = r.trucks.length || r.points.some((pt) => pt.passes.some((x) => x.progress))
        ? `<p class="hint">🔴 垃圾車位置每 30 秒自動更新（${time}），地圖上的 🚛 會跟著移動。</p>`
        : '<p class="hint">附近現在沒有正在開的垃圾車，出車後會自動出現在地圖上。</p>';
      const approx = r.points.some((pt) => pt.lat == null)
        ? '<p class="hint">這個縣市的資料只有地址、沒有座標，依你查的地點所在的里、路名比對，請以現場為準。</p>' : '';
      return head + list + approx + (r.loading ? '<p class="hint">⏳ 還有部分資料下載中，會自動更新。</p>' : '') + live;
    }

    // 下一台的路程進度自動打開（使用者自己點了別台就不換）
    function autoRoute(el, r) {
      const box = el.querySelector('.garbage-route');
      if (!box || !r?.next || (box.dataset.line && box.dataset.picked)) return;
      if (box.dataset.line === r.next.line) return;
      box.dataset.line = r.next.line;
      box.dataset.stop = r.next.name;
      refreshGarbageRoute(box, true);
    }

    // 地圖上的垃圾車：同一台車只移動位置，不重畫
    const truckLayer = L.layerGroup().addTo(map);
    const truckMarkers = new Map();
    const truckIcon = L.divIcon({ className: '', html: '<div style="font-size:26px;filter:drop-shadow(0 1px 2px #0008)">🚛</div>', iconSize: [30, 30], iconAnchor: [15, 15] });
    let lastGarbage = null, routeTruck = null; // 最近一次查詢結果、打開的整條路線上的垃圾車
    function updateTrucks(r) {
      lastGarbage = r;
      if (!r) routeTruck = null;
      const all = new Map();
      if (routeTruck) all.set(routeTruck.car, routeTruck);
      for (const t of r?.trucks || []) all.set(t.car, t);
      for (const pt of r?.points || []) for (const x of pt.passes) if (x.progress) all.set(x.progress.car, { ...x.progress, route: x.route });
      for (const [car, t] of all) {
        const text = `🚛 ${esc(car)}${t.route ? `（${esc(t.route)}）` : ''}<br>${esc(t.location || '')}<br>${t.ago ? `${t.ago} 分鐘前` : '剛剛'}回報`;
        const m = truckMarkers.get(car);
        if (m) m.setLatLng([t.lat, t.lng]).setPopupContent(text);
        else truckMarkers.set(car, L.marker([t.lat, t.lng], { icon: truckIcon, zIndexOffset: 1000 }).bindPopup(text).addTo(truckLayer));
      }
      for (const [car, m] of truckMarkers) if (!all.has(car)) { m.remove(); truckMarkers.delete(car); }
    }

    // 垃圾車結果顯示時自動更新位置與進度（資料還在下載就 10 秒後再試）；畫面換掉就停
    let garbageTimer = null;
    function watchGarbage(el, near, r) {
      clearTimeout(garbageTimer);
      remind(r, near);
      garbageTimer = setTimeout(async () => {
        if (!el.isConnected) { updateTrucks(null); return; }
        const fresh = await api(`/api/garbage?near=${near}`).catch(() => null);
        if (!el.isConnected) { updateTrucks(null); return; }
        if (fresh) {
          if (!r?.points.length && fresh.points.length) markGarbagePoints(fresh.points); // 下載好了才有地點
          updateTrucks(fresh);
          const list = el.querySelector('.garbage-list');
          if (list) list.innerHTML = garbageListHtml(fresh);
          const box = el.querySelector('.garbage-route[data-line]');
          if (box) refreshGarbageRoute(box);
          autoRoute(el, fresh);
        }
        watchGarbage(el, near, fresh || r);
      }, r?.loading ? 10000 : 30000);
    }

    // ---------- ⭐ 追蹤的地點（存在這台裝置）：一鍵查詢，垃圾車快到時提醒 ----------
    const FAV_KEY = 'garbageFavs';
    const loadFavs = () => { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; } };
    const saveFavs = (list) => { try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); } catch { /* 無法儲存就算了 */ } };
    const sameSpot = (a, b) => Math.abs(a.lat - b.lat) < 1e-4 && Math.abs(a.lng - b.lng) < 1e-4;
    const isFav = (pt) => pt && loadFavs().some((f) => sameSpot(f, pt));
    function favButton() {
      if (!placePoint) return '';
      return isFav(placePoint)
        ? '<button type="button" class="link" data-fav="off">★ 已追蹤（取消）</button>'
        : '<button type="button" class="link" data-fav="on">☆ 追蹤這個地點（垃圾車快到時提醒）</button>';
    }
    function renderFavs() {
      const box = $('garbageFavs');
      const list = loadFavs();
      box.hidden = !tools.has('garbage') || !list.length;
      box.innerHTML = list.map((f, k) => `<button type="button" data-fav-go="${k}">⭐ ${esc(f.name)}</button>`).join(' ');
    }
    $('garbageFavs').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-fav-go]');
      if (!b) return;
      const f = loadFavs()[Number(b.dataset.favGo)];
      placePoint = { ...f };
      $('place').value = f.name;
      $('form').requestSubmit();
    });
    $('out').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-fav]');
      if (!b || !placePoint) return;
      const list = loadFavs().filter((f) => !sameSpot(f, placePoint));
      if (b.dataset.fav === 'on') {
        list.push({ name: placePoint.name, lat: placePoint.lat, lng: placePoint.lng });
        // 提醒要通知權限；不給也沒關係，畫面上照樣顯示
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
      }
      saveFavs(list);
      renderFavs();
      b.outerHTML = favButton();
    });

    // 追蹤的地點：下一台 10 分鐘內到就提醒一次（網頁開著時）
    const reminded = new Set();
    function remind(r, near) {
      const n = r?.next;
      if (!n || n.soon == null || n.soon < 0 || n.soon > 10) return;
      const [lat, lng] = near.split(',').map(Number);
      if (!isFav({ lat, lng })) return;
      const key = `${n.line}|${n.start}|${new Date().toDateString()}`;
      if (reminded.has(key)) return;
      reminded.add(key);
      const text = `垃圾車約 ${n.soon} 分鐘後到「${n.name}」`;
      try { if (Notification.permission === 'granted') new Notification('🚛 垃圾車快到了', { body: text }); } catch { /* 不支援通知 */ }
      navigator.vibrate?.([300, 150, 300]);
      try { speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(text), { lang: 'zh-TW' })); } catch { /* 不支援語音 */ }
    }

    // 整條路線：每一站的表定時間，標出垃圾車現在在哪、你查的是哪一站
    async function showGarbageRoute(btn) {
      const box = btn.closest('.nearby').querySelector('.garbage-route');
      box.dataset.line = btn.dataset.garbageLine;
      box.dataset.stop = btn.dataset.garbageStop;
      box.dataset.picked = '1';
      box.innerHTML = '<span class="muted">查詢中…</span>';
      await refreshGarbageRoute(box, true);
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    // 路程進度：垃圾車在路上時，列出它到你這站之間的每一站；還沒出發就收起整條路線
    async function refreshGarbageRoute(box, first = false) {
      let r;
      try { r = await api('/api/garbage/route?line=' + encodeURIComponent(box.dataset.line)); } catch (e) { box.innerHTML = `<span class="muted">${esc(e.message)}</span>`; return; }
      const g = r.progress;
      if (first) {
        layer.clearLayers();
        L.polyline(r.stops.map((x) => [x.lat, x.lng]), { color: '#16a34a', weight: 4, opacity: 0.7 }).addTo(layer);
      }
      // 這條路線的垃圾車就算離你很遠也標出來
      routeTruck = g ? { ...g, route: r.route } : null;
      updateTrucks(lastGarbage);
      const mine = r.stops.findIndex((x) => x.name === box.dataset.stop);
      const li = (x, k) => `<li class="${g && k === g.atIndex ? 'truck' : ''}">${esc(x.start)}　${esc(x.name)}${g && k === g.atIndex ? ' 🚛 垃圾車在這' : ''}${k === mine ? ' 📍 你這裡' : ''}</li>`;
      if (g && mine > g.atIndex) {
        box.innerHTML = `<h3>路程進度：還有 ${mine - g.atIndex} 站（${esc(r.route)}）</h3>
          <ol class="garbage-stops" start="${g.atIndex + 1}">${r.stops.slice(g.atIndex, mine + 1).map((x, k) => li(x, g.atIndex + k)).join('')}</ol>`;
      } else {
        box.innerHTML = `<h3>${esc(r.route)}</h3><p class="muted">${g ? '垃圾車已經過你這裡了。' : '垃圾車還沒出發或沒有即時位置。'}</p>
          <details><summary>整條路線（${r.stops.length} 站）</summary><ol class="garbage-stops">${r.stops.map(li).join('')}</ol></details>`;
      }
    }
    $('out').addEventListener('click', (e) => {
      if (e.target.id === 'pasteGoogle') { pasteGoogle(); return; }
      if (e.target.id === 'pickOnMap') {
        if (isPhone()) setFormHidden(true);
        $('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      const b = e.target.closest('button[data-garbage-line]');
      if (b) showGarbageRoute(b);
      const go = e.target.closest('button[data-go]');
      if (go) {
        const [lat, lng] = go.dataset.go.split(',').map(Number);
        goTo({ lat, lng, name: go.dataset.goName });
        return;
      }
      const f = e.target.closest('[data-focus]');
      if (f && !e.target.closest('button')) {
        const [lat, lng] = f.dataset.focus.split(',').map(Number);
        map.setView([lat, lng], 18);
        const m = nearbyLayer.getLayers().find((x) => x.getLatLng().equals([lat, lng]));
        m?.openPopup();
        if (isPhone()) $('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });

    // 從查附近的出發地，規劃到選的公廁／置物櫃（回到規劃路線）。
    // 步行、YouBike、公車、捷運都開著，系統自動選最適合的，使用者可以在行程總覽點選換別的方式
    function goTo(dest) {
      const from = placePoint;
      for (const k of Object.keys(SERVICES)) tools.delete(k);
      for (const k of ['walk', 'bike', 'bus', 'metro']) tools.add(k);
      try { localStorage.setItem('tools', JSON.stringify([...tools])); } catch { /* 無法儲存就算了 */ }
      applyTools();
      if (from) { points.from = from; $('from').value = from.name; }
      while (stops.length > 1) { stops.at(-1).row.remove(); stops.pop(); }
      if (!stops.length) addStop();
      stops[0].el.value = dest.name;
      stops[0].point = dest;
      refreshStops();
      resetChoices();
      plan();
    }

    // 查某個地方附近（沒填就是目前位置）
    let placePoint = null;
    async function searchNearby(services) {
      pendingPick = null;
      trip = null;
      stopNav();
      layer.clearLayers();
      $('trip').innerHTML = '';
      show('<div class="card muted">查詢中…</div>');
      const text = $('place').value.trim();
      const p = placePoint || (placePoint = text ? await lookupFor({ key: 'place' }, text, '') : await currentPosition());
      if (!text) $('place').value = '目前位置';
      tripLayer.clearLayers();
      L.marker([p.lat, p.lng], { icon: pin('#dc2626', '📍') }).bindPopup(esc(p.name)).addTo(tripLayer);
      map.setView([p.lat, p.lng], 16);
      show(`<h2>📍 ${placeName(p)}</h2>${nearbyPanel(p, services, p.name === '目前位置' ? '目前位置' : '這裡')}`);
      fillNearby();
      if (isPhone()) setFormHidden(true);
    }

    // ---------- 台鐵／高鐵 ----------
    let railResult = null;
    const TRAIN_FILTERS = {
      all: { label: '全部', test: () => true },
      express: { label: '自強／普悠瑪／太魯閣', test: (t) => ['自強', '普悠瑪', '太魯閣'].includes(t.type) },
      local: { label: '區間／區間快', test: (t) => t.type.startsWith('區間') },
      chukuang: { label: '莒光', test: (t) => t.type === '莒光' },
    };
    const hhmm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
    const trainChip = (t) => `<span class="chip ${t.type === '高鐵' ? 'hsr' : t.type.startsWith('區間') ? 'tra' : 'fast'}">${esc(t.type)} ${esc(t.no)}</span>`;

    function renderRail(r, from, to) {
      railResult = { r, from, to, filter: 'all' };
      if (!r.trains.length) {
        stopNav();
        layer.clearLayers();
        return show(`<div class="card err">${r.today && !$('time').value ? '今天接下來' : `${esc(r.date)} ${hhmm(r.now.minutes)} 之後`}沒有可以搭的${esc(r.label)}班次
          （${esc(r.origins.map((s) => s.name).join('、'))} → ${esc(r.dests.map((s) => s.name).join('、'))}）。
          ${r.suspendedCount ? `<br><b>有 ${r.suspendedCount} 班因停駛取消</b>，請留意台鐵公告。` : ''}</div>`);
      }
      showTrain(0);
    }

    function showTrain(idx) {
      const { r, from, to, filter } = railResult;
      const t = r.trains[idx];
      stopNav();
      layer.clearLayers();

      const coach = r.system === 'coach';
      const stn = (s) => (coach ? s.name : `${s.name}站`);
      const stages = [
        ...accessStages(t.walkIn, t.origin, stn(t.origin),
          `已到達${stn(t.origin)}，請搭 ${t.type} ${t.no}（${t.dep} 開）`, true),
        { leg: t.leg, from: t.origin, to: t.dest, icon: r.system === 'thsr' ? '🚄' : coach ? '🚍' : '🚆',
          title: `${t.type} ${t.no}（${t.headsign}）到${t.dest.name}`, arrive: `到站了！請在${stn(t.dest)}下車` },
        ...accessStages(t.walkOut, to, `目的地：${to.name}`, '🎉 已抵達目的地', false),
      ];
      current = { stages, from, to };
      drawLegs(stages.map((s) => s.leg), from, to);
      map.fitBounds(L.featureGroup(layer.getLayers()).getBounds(), { padding: [30, 30] });

      const delay = (x) => (x.delay ? `<span class="low">誤點 ${x.delay} 分</span>` : '');
      const visible = r.trains.map((x, i) => [x, i]).filter(([x]) => TRAIN_FILTERS[filter].test(x));
      const detail = (st) => {
        const l = st.leg;
